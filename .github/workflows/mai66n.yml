name: Generate Permanent Keystore

on:
  workflow_dispatch: # Manual click to generate a key

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - name: Generate Keystore & Base64 String
      run: |
        # Generate the keystore
        keytool -genkey -v -keystore release.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias my-alias \
          -storepass mypassword123 \
          -keypass mypassword123 \
          -dname "CN=Fixer-kun, OU=None, O=None, L=None, ST=None, C=US"

        echo ""
        echo "=================================================================="
        echo "   COPY EVERYTHING BELOW THIS LINE FOR YOUR 'KEYSTORE_BASE64'   "
        echo "=================================================================="
        echo ""
        base64 -w 0 release.jks
        echo ""
        echo ""
        echo "=================================================================="
        echo "                     SECRET VALUES SUMMARY                        "
        echo "=================================================================="
        echo "KEYSTORE_BASE64   : (The long string printed above)"
        echo "KEYSTORE_PASSWORD : mypassword123"
        echo "KEY_ALIAS         : my-alias"
        echo "KEY_PASSWORD      : mypassword123"
        echo "=================================================================="
