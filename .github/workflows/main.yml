name: Build APK

on:
  workflow_dispatch: # This is the ONLY trigger. Purely manual button click.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Sign APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        # Decode the permanent keystore from Secrets
        echo "$KEYSTORE_BASE64" | base64 -d > release.jks

        UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
        APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)

        $APKSIGNER sign --ks release.jks \
          --ks-pass pass:mypassword123 \
          --ks-key-alias my-alias \
          --key-pass pass:mypassword123 \
          --out kotatsu-final.apk \
          "$UNSIGNED_APK"

        # Clean up key file after signing
        rm release.jks

    - name: Upload Artifact to Summary Page
      uses: actions/upload-artifact@v4
      with:
        name: kotatsu-apk
        path: kotatsu-final.apk
        retention-days: 90
