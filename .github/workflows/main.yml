name: Build APK

on:
  workflow_dispatch: # This is the ONLY trigger. Purely manual button click.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace

    - name: Sign APK
      run: |
        keytool -genkey -v -keystore throwaway.jks -keyalg RSA -keysize 2048 -validity 365 \
          -storepass password123 -keypass password123 \
          -dname "CN=Build, OU=None, O=None, L=None, ST=None, C=US"

        UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
        APKSIGNER=$(find $ANDROID_HOME/build-tools/ -name "apksigner" | sort -V | tail -n 1)

        $APKSIGNER sign --ks throwaway.jks \
          --ks-pass pass:password123 \
          --key-pass pass:password123 \
          --out kotatsu-final.apk \
          "$UNSIGNED_APK"

    - name: Upload Artifact to Summary Page
      uses: actions/upload-artifact@v4
      with:
        name: kotatsu-apk
        path: kotatsu-final.apk
        retention-days: 90
